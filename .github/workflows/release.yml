permissions:
  contents: write

name: release.yml
on:
  push:
    tags:
      - 'v**'

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: 'actions/checkout@v5'
        with:
          lfs: 'true'

      - name: Set up Go
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.25.5'

      - name: Install dependencies
        run: brew tap slp/krun && brew install golangci-lint libarchive e2fsprogs virglrenderer libepoxy molten-vk

      - name: Codesign binaries
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p action build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p action build.keychain
          security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k action build.keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}

      - name: Build
        run: go run scripts/build.go
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}

      - name: Upload artifact
        uses: 'actions/upload-artifact@v4'
        with:
          name: ovm-darwin
          path: |
            ovm-*.tar.gz
          if-no-files-found: error
          overwrite: true

  build-linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: 'actions/checkout@v5'
        with:
          lfs: 'true'

      - name: Set up Go
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.25.5'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget patchelf libarchive-tools libarchive-dev libext2fs-dev libblkid-dev uuid-dev zstd
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Build
        run: go run scripts/build.go

      - name: Upload artifact
        uses: 'actions/upload-artifact@v4'
        with:
          name: ovm-linux
          path: |
            ovm-*.tar.gz
          if-no-files-found: error
          overwrite: true

  release:
    needs: [ build-macos, build-linux ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: 'actions/download-artifact@v4'
        with:
          pattern: ovm-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ovm-*.tar.gz
          append_body: true
          draft: false
          prerelease: false
          make_latest: true
